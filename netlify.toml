[build]
  publish = "."
  # Tidak perlu build command karena ini static site

[functions]
  directory = "netlify/functions"

# Headers untuk performa dan keamanan
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' https://spensada.me data: blob: https://cdn.jsdelivr.net; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://spensada.me; frame-src https://docs.google.com https://forms.gle https://script.google.com; worker-src 'self' blob:"

[[headers]]
  for = "/api/exams"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=120, stale-while-revalidate=300"

# Redirect /api/exams ke function (sudah di-handle oleh config.path, ini backup)
[[redirects]]
  from = "/api/exams"
  to = "/.netlify/functions/exams"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/violation"
  to = "/.netlify/functions/violation"
  status = 200

[[redirects]]
  from = "/api/verify-token"
  to = "/.netlify/functions/verify-token"
  status = 200
