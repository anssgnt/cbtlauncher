[build]
  publish = "."
  # Tidak perlu build command karena ini static site

[functions]
  directory = "netlify/functions"

# Headers untuk performa dan keamanan
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' https://spensada.me data:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com; frame-src https://docs.google.com https://forms.gle"

[[headers]]
  for = "/api/exams"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=120, stale-while-revalidate=300"

# Redirect /api/exams ke function (sudah di-handle oleh config.path, ini backup)
[[redirects]]
  from = "/api/exams"
  to = "/.netlify/functions/exams"
  status = 200
